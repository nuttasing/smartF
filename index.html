/* เวทีออกแบบที่ 1920x1080 — ย่อ/ขยายด้วย JS ให้ตรงกับ background-size: cover */
.stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1920px;
  height: 1080px;
  transform-origin: center center;
  transform: translate(-50%, -50%) scale(var(--sx, 1), var(--sy, 1));
  user-select: none;
  -webkit-user-select: none;
}

.sensor {
  position: absolute;
  left: var(--x);
  top: 0;
  width: 252px;
  height: 1080px;
  pointer-events: none;
}
.sensor > * { pointer-events: auto; }

/* กล่องตัวเลข */
.box {
  position: absolute;
  left: 0;
  top: 236px;
  width: 252px;
  height: 254px;
  background: #e0abb1;
  border: 3px solid #c164c8;
  border-radius: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.value {
  font-family: "Itim", "Sriracha", sans-serif;
  font-size: 220px;
  line-height: 1;
  padding-bottom: 14px;
  background: linear-gradient(160deg, #5a5a5a 0%, #1c1c1c 55%, #000 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  transition: transform .25s ease;
}
.value.pop { transform: scale(1.08); }

/* ชื่อใต้กล่อง */
.label {
  position: absolute;
  left: -40px;
  width: 332px;
  top: 505px;
  text-align: center;
  font-family: "Mitr", "Itim", sans-serif;
  font-weight: 500;
  font-size: 44px;
  line-height: 64px;
  color: #111;
}

/* ปุ่ม toggle */
.toggle {
  position: absolute;
  left: 9px;
  top: var(--y);
  width: 233px;
  height: 65px;
  border: 0;
  border-radius: 33px;
  background: #c8d0d9;
  cursor: pointer;
  padding: 0;
  outline: none;
  transition: background .25s ease;
  touch-action: none;
}
.toggle:focus-visible { box-shadow: 0 0 0 4px rgba(193, 100, 200, .55); }

.knob {
  position: absolute;
  left: 0;
  top: 0;
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffffff 0%, #ececec 45%, #cfcfcf 100%);
  border: 2px solid #b9b9b9;
  box-shadow: 0 2px 4px rgba(0, 0, 0, .25), inset 0 -3px 5px rgba(0, 0, 0, .08);
  transition: transform .25s ease;
}

.toggle[aria-checked="true"] { background: #7fc241; }
.toggle[aria-checked="true"] .knob { transform: translateX(168px); }
.toggle.dragging, .toggle.dragging .knob { transition: none; }

/* หัวข้อ */
.title {
  position: absolute;
  left: 460px;
  width: 890px;
  top: 40px;
  text-align: center;
  font-family: "Sriracha", "Itim", sans-serif;
  font-weight: 400;
  font-size: 140px;
  line-height: 150px;
  color: #000;
  white-space: nowrap;
}

</style>
</head>
<body>

  <!-- เวทีขนาด 1920x1080 จะถูกย่อ/ขยายให้ตรงกับพื้นหลังแบบ cover เสมอ -->
  <main class="stage" id="stage">

    <section class="sensor" style="--x:304px">
      <div class="box"><span class="value" data-key="temp">7</span></div>
      <button class="toggle" style="--y:589px" role="switch" aria-checked="false" aria-label="อุณหภูมิ" data-target="temp">
        <span class="knob"></span>
      </button>
    </section>

    <section class="sensor" style="--x:628px">
      <div class="box"><span class="value" data-key="humidity">7</span></div>
      <button class="toggle" style="--y:593px" role="switch" aria-checked="false" aria-label="ความชื้น" data-target="humidity">
        <span class="knob"></span>
      </button>
    </section>

    <section class="sensor" style="--x:961px">
      <div class="box"><span class="value" data-key="light">7</span></div>
      <button class="toggle" style="--y:596px" role="switch" aria-checked="false" aria-label="ค่าแสง" data-target="light">
        <span class="knob"></span>
      </button>
    </section>

    <section class="sensor" style="--x:1276px">
      <div class="box"><span class="value" data-key="water">7</span></div>
      <button class="toggle" style="--y:603px" role="switch" aria-checked="false" aria-label="ระดับน้ำ" data-target="water">
        <span class="knob"></span>
      </button>
    </section>
  </main>

  <script>
(() => {
  "use strict";

  const DESIGN_W = 1920;
  const DESIGN_H = 1080;
  const TRAVEL = 168;          // ระยะที่ลูกบิดเลื่อน (233 - 65)
  const UPDATE_MS = 1500;      // เวลาสุ่มค่าใหม่ตอนเปิด toggle

  const stage = document.getElementById("stage");

  /* ---------- ย่อ/ขยายเวทีตามขนาดหน้าต่าง (เต็มจอเสมอ) ---------- */
  function fit() {
    // ยืดเต็มหน้าต่างทั้งแนวกว้างและแนวสูง ไม่มีขอบว่าง
    stage.style.setProperty("--sx", window.innerWidth / DESIGN_W);
    stage.style.setProperty("--sy", window.innerHeight / DESIGN_H);
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  fit();

  /* ---------- สุ่มตัวเลข (ตำแหน่งเค้าโครงคงเดิม) ---------- */
  const ranges = {
    temp:     [20, 40],   // อุณหภูมิ
    humidity: [30, 90],   // ความชื้น
    light:    [0, 99],    // ค่าแสง
    water:    [0, 99]     // ระดับน้ำ
  };

  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

  function setValue(key) {
    const el = document.querySelector(`.value[data-key="${key}"]`);
    const [min, max] = ranges[key];
    el.textContent = rand(min, max);
    el.classList.add("pop");
    setTimeout(() => el.classList.remove("pop"), 250);
    // ลดขนาดตัวอักษรเมื่อเป็นเลข 2 หลักเพื่อให้พอดีกล่อง
    el.style.fontSize = el.textContent.length > 1 ? "150px" : "220px";
  }

  // สุ่มค่าเริ่มต้นตอนโหลดหน้า
  Object.keys(ranges).forEach(setValue);

  /* ---------- toggle: คลิก หรือ ลากได้ ---------- */
  const timers = {};

  function setState(btn, on) {
    btn.setAttribute("aria-checked", String(on));
    btn.querySelector(".knob").style.transform = "";
    const key = btn.dataset.target;

    clearInterval(timers[key]);
    if (on) {
      setValue(key);
      timers[key] = setInterval(() => setValue(key), UPDATE_MS);
    }
  }

  document.querySelectorAll(".toggle").forEach(btn => {
    const knob = btn.querySelector(".knob");
    let startX = 0, startOffset = 0, moved = false, dragging = false;

    const isOn = () => btn.getAttribute("aria-checked") === "true";
    const scale = () => parseFloat(getComputedStyle(stage).getPropertyValue("--sx")) || 1;

    btn.addEventListener("pointerdown", e => {
      dragging = true;
      moved = false;
      startX = e.clientX;
      startOffset = isOn() ? TRAVEL : 0;
      btn.setPointerCapture(e.pointerId);
      btn.classList.add("dragging");
    });

    btn.addEventListener("pointermove", e => {
      if (!dragging) return;
      const dx = (e.clientX - startX) / scale();
      if (Math.abs(dx) > 4) moved = true;
      const pos = Math.min(TRAVEL, Math.max(0, startOffset + dx));
      knob.style.transform = `translateX(${pos}px)`;
    });

    const end = e => {
      if (!dragging) return;
      dragging = false;
      btn.classList.remove("dragging");
      if (moved) {
        const dx = (e.clientX - startX) / scale();
        const pos = Math.min(TRAVEL, Math.max(0, startOffset + dx));
        setState(btn, pos > TRAVEL / 2);
      } else {
        setState(btn, !isOn());   // คลิกธรรมดา = สลับสถานะ
      }
    };

    btn.addEventListener("pointerup", end);
    btn.addEventListener("pointercancel", () => {
      dragging = false;
      btn.classList.remove("dragging");
      knob.style.transform = "";
    });

    // รองรับคีย์บอร์ด (Space / Enter)
    btn.addEventListener("keydown", e => {
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        setState(btn, !isOn());
      }
    });
  });
})();

</script>
</body>
</html>
